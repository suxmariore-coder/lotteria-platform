<style>
body{
  font-family:Arial,sans-serif;
  background:#FCD34D;
  margin:0;
  padding:20px;
  overflow-x:hidden;
}

/* Palline */
.ball{
  position:absolute;
  width:90px;height:90px;border-radius:50%;
  background:#fff;color:#1E3A8A;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:22px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  pointer-events:none;
  z-index:0;
}
.ball1{top:40px;left:-30px;}
.ball2{top:10px;right:-40px;}

.container{
  max-width:500px;
  margin:40px auto;
  position:relative;
  z-index:2;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:10px;
}

.logo{
  height:250px;
  width:auto;
  display:block;
  pointer-events:none;   /* ⭐ non blocca click */
  user-select:none;
}

/* BOTTONI */
.top-actions{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin:10px 0 20px;
  position:relative;
  z-index:5;
}

button{
  width:100%;
  padding:16px;
  border-radius:18px;
  font-size:16px;
  font-weight:600;
  border:none;
  cursor:pointer;
}

.primary{background:#1E3A8A;color:#fff;}
.secondary{background:transparent;color:#0F1E4A;border:2px solid #0F1E4A;}

#status{text-align:center;margin:10px 0 20px;font-size:14px;}

.grid{display:flex;flex-direction:column;gap:18px;}

.card{
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(4px);
  border-radius:18px;
  padding:16px;
  box-shadow:0 4px 15px rgba(0,0,0,0.06);
}

.card-top{display:flex;gap:14px;}
.card-text{flex:1;min-width:0;}

.thumb{
  width:90px;aspect-ratio:1;border-radius:12px;
  background:#eee;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.thumb img{width:100%;height:100%;object-fit:cover;}

.title{margin:0;font-size:16px;color:#0F1E4A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.price{font-weight:bold;color:#1E3A8A;margin-top:6px;}

.desc{
  font-size:13px;color:#555;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}

.lottery-badge{
  margin-top:8px;background:#fff;border-radius:12px;
  padding:8px 10px;font-size:12px;color:#1E3A8A;
  height:48px;display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.actions{display:flex;gap:10px;margin-top:10px;}
.actions button{flex:1;padding:14px;border-radius:14px;font-size:14px;}

.open{background:#1E3A8A;color:#fff;}
.manage{background:transparent;border:2px solid #0F1E4A;color:#0F1E4A;}

.footer{font-size:13px;margin:50px 0 30px;opacity:0.9;text-align:center;}
</style>
</head>

<body>

<div class="ball ball1">12</div>
<div class="ball ball2">37</div>

<div class="container">

<header class="navbar">
  <img src="/lotteriffa-real.svg" class="logo">
</header>

<div class="top-actions">
  <button id="btnCreate" class="primary">➕ Crea nuova lotteria</button>
  <button id="btnLogout" class="secondary">Esci</button>
</div>

<div id="status"></div>
<div id="lotteries" class="grid"></div>

</div>

<div class="footer">© 2026 LotteRiffa</div>
