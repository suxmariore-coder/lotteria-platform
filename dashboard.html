<!DOCTYPE html>
<html lang="it">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A8A">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lotteriffa">
<link rel="apple-touch-icon" href="/icon-192.png">

<meta charset="UTF-8">
<title>Dashboard Owner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<!-- OneSignal -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "e3470c97-a9e9-4a27-b151-833457d130ed"
  });

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
  overflow-x: hidden;
}

/* Palline IDENTICHE alla login */
.ball {
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: white;
  color: #1E3A8A;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 22px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  opacity: 0.15;
}

.ball1 { top: 40px; left: -30px; }
.ball2 { top: 140px; right: -30px; }

/* Container come login */
.container {
  max-width: 500px;
  margin: 60px auto;
}

/* Titolo stile login */
h1 {
  text-align: center;
  font-size: 36px;
  color: #1E3A8A;
  margin-bottom: 25px;
}

/* Top buttons stile login */
.top-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

button {
  width: 100%;
  padding: 16px;
  border-radius: 18px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: transform 0.2s ease;
}

button:active {
  transform: scale(0.98);
}

.primary {
  background: #1E3A8A;
  color: white;
}

.secondary {
  background: transparent;
  color: #0F1E4A;
  border: 2px solid #0F1E4A;
}

/* Status */
#status {
  text-align: center;
  margin: 10px 0 20px;
  font-size: 14px;
}

/* Card stile coerente */
.grid {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-top {
  display: flex;
  gap: 14px;
}

.thumb {
  width: 80px;
  height: 80px;
  border-radius: 12px;
  background: #eee;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.title {
  margin: 0;
  font-size: 16px;
  color: #0F1E4A;
}

.price {
  font-weight: bold;
  color: #1E3A8A;
  margin-top: 6px;
}

.desc {
  font-size: 13px;
  color: #555;
  margin-top: 6px;
}

.actions {
  display: flex;
  gap: 10px;
}

.actions button {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
}

.open {
  background: #1E3A8A;
  color: white;
}

.manage {
  background: transparent;
  border: 2px solid #0F1E4A;
  color: #0F1E4A;
}
</style>
</head>

<body>

<div class="ball ball1">12</div>
<div class="ball ball2">37</div>

<div class="container">

<h1>Le tue lotterie</h1>

<div class="top-actions">
  <button id="btnCreate" class="primary">➕ Crea nuova lotteria</button>
  <button id="btnLogout" class="secondary">Esci</button>
</div>

<div id="status"></div>
<div id="lotteries" class="grid"></div>

</div>

<script>
const SUPABASE_URL = "https://fkgxomjctgvbpvgfgfko.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrZ3hvbWpjdGd2YnB2Z2ZnZmtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwNTA4NjYsImV4cCI6MjA4MDYyNjg2Nn0.Ogun4Qs4zGosOOify0yKC4NgO9vy3QPtvy6F96zo6Gk";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const elGrid = document.getElementById("lotteries");
const elStatus = document.getElementById("status");

document.getElementById("btnCreate").onclick = () => {
  location.href = "crea-lotteria.html";
};

document.getElementById("btnLogout").onclick = async () => {
  await sb.auth.signOut();
  location.href = "login.html";
};

async function getUserSafe() {
  const { data } = await sb.auth.getUser();
  if (!data?.user) {
    location.href = "login.html";
    return null;
  }
  return data.user;
}

async function loadDashboard(ownerId) {
  elGrid.innerHTML = "";
  elStatus.textContent = "Caricamento…";

  const { data: lotteries } = await sb
    .from("lotteries")
    .select("id,title,ticket_price,description,prize_images,created_at")
    .eq("owner_id", ownerId)
    .order("created_at", { ascending: false });

  elStatus.textContent = "";

  lotteries?.forEach(l => {
    const img = Array.isArray(l.prize_images) && l.prize_images[0];

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <div class="thumb">
          ${img ? `<img src="${img}" />` : "Nessuna foto"}
        </div>
        <div>
          <h3 class="title">${l.title}</h3>
          <div class="price">€ ${l.ticket_price}</div>
          <div class="desc">${l.description || ""}</div>
        </div>
      </div>
      <div class="actions">
        <button class="open">Apri</button>
        <button class="manage">Gestisci</button>
      </div>
    `;

    card.querySelector(".open").onclick = () =>
      window.open(`index.html?id=${l.id}`, "_blank");

    card.querySelector(".manage").onclick = () =>
      location.href = `manage-lottery.html?id=${l.id}`;

    elGrid.appendChild(card);
  });
}

(async () => {
  const user = await getUserSafe();
  if (!user) return;
  await loadDashboard(user.id);
})();
</script>

</body>
</html>
