<!DOCTYPE html>
<html lang="it">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lotteriffa">
<link rel="apple-touch-icon" href="/icon-192.png">

<meta charset="UTF-8">
<title>Gestisci Lotteria</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
/* ---- TUTTO IL TUO CSS ORIGINALE ---- */
body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 16px; }
h1, h2 { text-align: center; margin: 6px 0; }
.container { max-width: 600px; margin: 0 auto; }

.header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.back { text-decoration: none; font-size: 14px; color: #333; }

#statusMsg { text-align: center; color: #444; margin: 10px 0 14px; font-size: 14px; }

.status-banner { padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 12px; }
.status-active { background: #e6f4ea; color: #1e7e34; }
.status-closed { background: #fff3cd; color: #856404; }
.status-finished { background: #f8d7da; color: #842029; }
.status-archived { background: #e2e3e5; color: #41464b; }

.card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; }

.row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 6px; }
.row span { color: #555; }
.row b { color: #111; }

.btn { width: 100%; padding: 12px; border-radius: 6px; border: none; font-size: 15px; cursor: pointer; margin-top: 8px; }
.primary { background: #1e7e34; color: #fff; }
.secondary { background: #6c757d; color: #fff; }
.warning { background: #ffc107; color: #333; }

.images { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.images img { height: 90px; width: 120px; border-radius: 8px; object-fit: cover; }

.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }

.number {
  height: 52px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.available { background: #1e7e34; }
.pending { background: #ffc107; color: #333; }
.sold { background: #c82333; }

.buyer { font-size: 11px; margin-top: 2px; }

@media (min-width: 768px) {
  .grid { grid-template-columns: repeat(10, 1fr); }
}

/* ✨ Highlight animato */
.number.highlighted {
  animation: pulseHighlight 1.2s ease-in-out 3;
  box-shadow: 0 0 0 3px #1E3A8A;
}

@keyframes pulseHighlight {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>
<div class="container">

<div class="header">
  <a class="back" href="dashboard.html">← Dashboard</a>
</div>

<h1 id="pageTitle">Gestisci Lotteria</h1>
<div id="statusMsg"></div>

<div id="statusBanner" class="status-banner" style="display:none;"></div>

<div class="card">
  <h2>Panoramica</h2>
  <div class="row"><span>Prezzo biglietto</span><b id="pTicket">—</b></div>
  <div class="row"><span>Data estrazione</span><b id="pDraw">—</b></div>
  <div class="row"><span>Ruota</span><b id="pWheel">—</b></div>
  <div class="row"><span>Venduti</span><b id="pSold">—</b></div>
  <div class="row"><span>In attesa</span><b id="pPending">—</b></div>
</div>

<div class="card">
  <h2>Numeri</h2>
  <div id="numbersGrid" class="grid"></div>
</div>

<div class="card" id="pendingSection">
  <h2>Pagamenti in attesa</h2>
  <div id="pendingList"></div>
</div>

</div>

<script>
const SUPABASE_URL = "https://fkgxomjctgvbpvgfgfko.supabase.co";
const SUPABASE_ANON_KEY = "TUA_ANON_KEY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const LOTTERY_ID = new URLSearchParams(location.search).get("id");
const HIGHLIGHT_ID = new URLSearchParams(location.search).get("highlight");
const FOCUS_SECTION = new URLSearchParams(location.search).get("focus");

async function loadNumbersAndPending() {

  const { data } = await sb
    .from("lottery_numbers")
    .select("id,number,status,payment_status,pending_buyer_name,buyer_name")
    .eq("lottery_id", LOTTERY_ID)
    .order("number");

  const grid = document.getElementById("numbersGrid");
  const pendingList = document.getElementById("pendingList");

  grid.innerHTML = "";
  pendingList.innerHTML = "";

  data.forEach(row => {

    const cls =
      row.status === "sold" ? "sold" :
      row.payment_status === "pending" ? "pending" :
      "available";

    const d = document.createElement("div");
    d.className = `number ${cls}`;
    d.innerHTML = `
      <div>${row.number}</div>
      ${
        cls === "pending"
        ? `<div class="buyer">⏳ ${row.pending_buyer_name || ""}</div>`
        : cls === "sold"
        ? `<div class="buyer">${row.buyer_name || ""}</div>`
        : ""
      }
    `;

    // 🔥 Highlight se arriva da notifica
    if (HIGHLIGHT_ID && row.id === HIGHLIGHT_ID) {
      d.classList.add("highlighted");
      setTimeout(() => {
        d.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 400);
    }

    grid.appendChild(d);

    if (row.payment_status === "pending") {
      const div = document.createElement("div");
      div.innerHTML = `<b>${row.pending_buyer_name}</b> – Numero ${row.number}`;
      pendingList.appendChild(div);
    }
  });

  // 🚀 Scroll automatico alla sezione pending
  if (FOCUS_SECTION === "pending") {
    setTimeout(() => {
      document.getElementById("pendingSection")
        .scrollIntoView({ behavior: "smooth", block: "start" });
    }, 300);
  }
}

(async () => {
  await loadNumbersAndPending();
})();
</script>

</body>
</html>
