<!DOCTYPE html>
<html lang="it">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A8A">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta charset="UTF-8" />

<title>Imposta nuova password</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #F2C300;
  color: #0F1E4A;
  text-align: center;
}

.container {
  padding: 24px;
  max-width: 420px;
  margin: auto;
}

h1 {
  font-size: 42px;
  margin: 40px 0 10px 0;
}

p {
  font-size: 15px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid #ddd;
  font-size: 16px;
  margin-bottom: 14px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 18px;
  background: #1E3A8A;
  color: white;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease;
}

button:active {
  transform: scale(0.97);
}

#result {
  margin-top: 16px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <h1>LotteRiffa</h1>

  <p><strong>Imposta la tua nuova password</strong></p>

  <input type="password" id="password" placeholder="Nuova password" />
  <input type="password" id="confirm" placeholder="Conferma password" />

  <button onclick="updatePassword()">Salva nuova password</button>

  <p id="result"></p>

</div>

<script>
const SUPABASE_URL = "https://fkgxomjctgvbpvgfgfko.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrZ3hvbWpjdGd2YnB2Z2ZnZmtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwNTA4NjYsImV4cCI6MjA4MDYyNjg2Nn0.Ogun4Qs4zGosOOify0yKC4NgO9vy3QPtvy6F96zo6Gk";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function updatePassword() {
  const password = document.getElementById("password").value.trim();
  const confirm = document.getElementById("confirm").value.trim();

  if (!password || !confirm) {
    document.getElementById("result").innerText =
      "Inserisci e conferma la nuova password";
    return;
  }

  if (password !== confirm) {
    document.getElementById("result").innerText =
      "Le password non coincidono";
    return;
  }

  if (password.length < 6) {
    document.getElementById("result").innerText =
      "La password deve avere almeno 6 caratteri";
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({
    password: password
  });

  if (error) {
    document.getElementById("result").innerText =
      "❌ Errore durante l'aggiornamento";
    return;
  }

  document.getElementById("result").innerText =
    "✅ Password aggiornata con successo";

  setTimeout(() => {
    window.location.href = "login.html";
  }, 2000);
}
</script>

</body>
</html>
