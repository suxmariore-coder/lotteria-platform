<!DOCTYPE html>
<html lang="it">
<head>
<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#1E3A8A">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lotteriffa">

<link rel="apple-touch-icon" href="/icon-192.png">
  <meta charset="UTF-8">
  <title>Pagamento completato</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      max-width: 420px;
      width: 100%;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-bottom: 10px;
      color: #1e7e34;
    }

    p {
      color: #444;
      font-size: 15px;
      line-height: 1.5;
    }

    .spinner {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #1e7e34;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .small {
      font-size: 13px;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>✅ Pagamento riuscito</h1>

    <p>
      Grazie! Il pagamento è stato completato correttamente.
      <br><br>
      Stiamo creando la tua lotteria, ci vorranno solo pochi secondi.
    </p>

    <div class="spinner"></div>

    <p class="small">
      Verrai reindirizzato automaticamente alla dashboard.
    </p>
  </div>

  <script>
    // ⏳ tempo tecnico per webhook + DB
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 5000);
  </script>

</body>
</html>
