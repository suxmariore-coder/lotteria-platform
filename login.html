    <input id="email" type="email" placeholder="La tua Email" />

<a href="#" class="forgot-link" onclick="resetPassword(event)">
  Password dimenticata?

      Dopo l’accesso potrai creare la tua prima lotteria

<script>
const SUPABASE_URL = "https://fkgxomjctgvbpvgfgfko.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrZ3hvbWpjdGd2YnB2Z2ZnZmtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwNTA4NjYsImV4cCI6MjA4MDYyNjg2Nn0.Ogun4Qs4zGosOOify0yKC4NgO9vy3QPtvy6F96zo6Gk";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    document.getElementById("result").innerText = "Inserisci email e password";
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    document.getElementById("result").innerText = "❌ Login fallito";
    return;
  }

  window.location.href = "dashboard.html";
}

async function register() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    document.getElementById("result").innerText = "Inserisci email e password";
    return;
  }

  const { error } = await supabaseClient.auth.signUp({ email, password });

  if (error) {
    document.getElementById("result").innerText = "❌ Registrazione fallita";
    return;
  }

  document.getElementById("result").innerText =
    "✅ Registrazione completata. Ora puoi accedere.";
}

async function resetPassword(e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();

  if (!email) {
    document.getElementById("result").innerText =
      "Inserisci prima la tua email per recuperare la password";
    return;
  }

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: "https://www.lotteriffa.it/update-password.html"
  });

  if (error) {
    document.getElementById("result").innerText =
      "❌ Errore nell'invio email";
    return;
  }

  document.getElementById("result").innerText =
    "✅ Email di recupero inviata. Controlla la tua casella.";
}
</script>
