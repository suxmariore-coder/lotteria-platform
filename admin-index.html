<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel – Promo Codes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>
  <h1>🛠️ Superpannello Admin</h1>

  <button onclick="createPromoPrompt()">➕ Crea promo</button>
  <button onclick="logout()">Esci</button>

  <pre id="output"></pre>

<script>
const SUPABASE_URL = "https://fkgxomjctgvbpvgfgfko.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrZ3hvbWpjdGd2YnB2Z2ZnZmtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwNTA4NjYsImV4cCI6MjA4MDYyNjg2Nn0.Ogun4Qs4zGosOOify0yKC4NgO9vy3QPtvy6F96zo6Gk";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function logout() {
  await sb.auth.signOut();
  location.href = "login.html";
}

async function requireAuth() {
  const { data } = await sb.auth.getUser();
  if (!data?.user) {
    location.href = "login.html";
    return null;
  }
  return data.user;
}

async function loadPromos() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;

  const res = await fetch(
    `${SUPABASE_URL}/functions/v1/admin-list-promos`,
    {
      method: "POST",
      headers: {
        Authorization: `Bearer ${session.access_token}`,
        apikey: SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
      },
    }
  );

  const data = await res.json();
  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);
}

async function createPromoPrompt() {
  const code = prompt("Codice promo");
  if (!code) return;

  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;

  const res = await fetch(
    `${SUPABASE_URL}/functions/v1/admin-create-promo`,
    {
      method: "POST",
      headers: {
        Authorization: `Bearer ${session.access_token}`,
        apikey: SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        code: code.toUpperCase(),
      }),
    }
  );

  const data = await res.json();
  alert(JSON.stringify(data));
  loadPromos();
}

(async () => {
  const user = await requireAuth();
  if (!user) return;
  loadPromos();
})();
</script>
</body>
</html>
