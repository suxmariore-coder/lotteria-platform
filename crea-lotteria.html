<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Crea la tua lotteria</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}
body{font-family:Arial;background:#f5f5f5;padding:20px;margin:0;}
.container{max-width:500px;background:#fff;padding:20px;border-radius:10px;margin:auto;}
h2{text-align:center;margin-top:0;}
label{font-weight:bold;margin-top:14px;display:block;font-size:14px;}
input,textarea,select{width:100%;padding:10px;margin-top:6px;border-radius:6px;border:1px solid #ccc;font-size:14px;}
textarea{resize:vertical;min-height:80px;}
button{width:100%;margin-top:20px;padding:12px;background:#2d7bf4;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
.error{color:red;margin-top:15px;text-align:center;font-size:14px;}
.promo-box{margin-top:18px;padding:12px;background:#f8f9fa;border-radius:8px;border:1px dashed #ccc;}
</style>
</head>

<body>

<div class="container">
<h2>🎟️ Crea la tua lotteria</h2>

<label>Titolo</label>
<input id="title">

<label>Descrizione premio</label>
<textarea id="description"></textarea>

<label>Prezzo biglietto (€)</label>
<input id="ticket_price" type="number" min="1">

<label>Password admin</label>
<input id="admin_password" type="password">

<label>Data estrazione</label>
<input id="draw_date" type="date">

<label>Ruota</label>
<select id="wheel">
<option value="">Seleziona ruota</option>
<option>Bari</option>
<option>Cagliari</option>
<option>Firenze</option>
<option>Genova</option>
<option>Milano</option>
<option>Napoli</option>
<option>Palermo</option>
<option>Roma</option>
<option>Torino</option>
<option>Venezia</option>
<option>Nazionale</option>
</select>

<label>Immagini premio (max 5)</label>
<input id="prize_images" type="file" accept="image/*" multiple>

<label>PayPal</label>
<input id="paypal_user">

<label>Revolut</label>
<input id="revolut_link">

<label>WhatsApp</label>
<input id="whatsapp_contact">

<div class="promo-box">
<label>Codice promo (opzionale)</label>
<input id="promo_code" placeholder="ES: FREE2026">
</div>

<button onclick="createLottery()">🚀 Crea Lotteria</button>

<div id="result" class="error"></div>

</div>

<script>
const SUPABASE_URL = "https://fkgxomjctgvbpvgfgfko.supabase.co";
const SUPABASE_ANON_KEY = "TUA_ANON_KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function createLottery() {

const { data:{session} } = await sb.auth.getSession();
if(!session){ location.href="login.html"; return; }

const resultBox = document.getElementById("result");
resultBox.innerText = "";

const files = document.getElementById("prize_images").files;
if(files.length>5){ alert("Max 5 immagini"); return; }

const lottery_payload = {
title: document.getElementById("title").value.trim(),
description: document.getElementById("description").value.trim(),
ticket_price: Number(document.getElementById("ticket_price").value),
admin_password: document.getElementById("admin_password").value,
draw_date: document.getElementById("draw_date").value || null,
wheel: document.getElementById("wheel").value || null,
paypal_user: document.getElementById("paypal_user").value || null,
revolut_link: document.getElementById("revolut_link").value || null,
whatsapp_contact: document.getElementById("whatsapp_contact").value || null,
};

const promo_code = document.getElementById("promo_code").value.trim() || null;

const res = await fetch(`${SUPABASE_URL}/functions/v1/create-fee-checkout`,{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":`Bearer ${session.access_token}`
},
body: JSON.stringify({ lottery_payload, promo_code })
});

const data = await res.json();

if(!res.ok){
resultBox.innerText = data.error || "Errore creazione";
return;
}

/* =========================
   🎁 CASO GRATIS
==========================*/
if(data.success){

const lotteryId = data.lottery_id;

const uploadedUrls=[];
for(let i=0;i<files.length;i++){
const file=files[i];
const ext=file.name.split(".").pop();
const path=`lotteries/${lotteryId}/${Date.now()}_${i}.${ext}`;

const { error } = await sb.storage
.from("lottery-images")
.upload(path,file);

if(error){ alert("Errore upload"); return; }

const { data:pub } = sb.storage
.from("lottery-images")
.getPublicUrl(path);

uploadedUrls.push(pub.publicUrl);
}

if(uploadedUrls.length){
await sb.from("lotteries")
.update({ prize_images: uploadedUrls })
.eq("id", lotteryId);
}

location.href = "dashboard.html?created=1";
return;
}

/* =========================
   💳 CASO STRIPE
==========================*/
if(data.checkout_url){
location.href = data.checkout_url;
}

}
</script>

</body>
</html>
