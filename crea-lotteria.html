<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Crea la tua lotteria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      margin: auto;
    }
    h2 { text-align: center; margin-top: 0; }
    label {
      font-weight: bold;
      margin-top: 14px;
      display: block;
      font-size: 14px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #2d7bf4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .error {
      color: #c82333;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>
<div class="container">
  <h2>🎟️ Crea la tua lotteria</h2>

  <label>Titolo</label>
  <input id="title">

  <label>Descrizione premio</label>
  <textarea id="description"></textarea>

  <label>Prezzo biglietto (€)</label>
  <input id="ticket_price" type="number" min="1">

  <label>Password admin</label>
  <input id="admin_password" type="password">

  <label>Data estrazione</label>
  <input id="draw_date" type="date">

  <label>Ruota</label>
  <select id="wheel">
    <option value="">Seleziona</option>
    <option>Bari</option><option>Milano</option><option>Roma</option>
    <option>Napoli</option><option>Torino</option><option>Nazionale</option>
  </select>

  <label>Immagini premio (max 5)</label>
  <input id="prize_images" type="file" accept="image/*" multiple>

  <label>PayPal (opzionale)</label>
  <input id="paypal_user">

  <label>Revolut (opzionale)</label>
  <input id="revolut_link">

  <label>WhatsApp owner</label>
  <input id="whatsapp_contact">

  <label>Codice promo (opzionale)</label>
  <input id="promo_code" placeholder="ES: FREE2026">

  <button onclick="startCheckout()">💳 Paga e crea la tua Lotteriffa</button>

  <div id="result" class="error"></div>
</div>

<script>
const SUPABASE_URL = "https://fkgxomjctgvbpvgfgfko.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrZ3hvbWpjdGd2YnB2Z2ZnZmtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwNTA4NjYsImV4cCI6MjA4MDYyNjg2Nn0.Ogun4Qs4zGosOOify0yKC4NgO9vy3QPtvy6F96zo6Gk";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function buildPayload() {
  return {
    title: title.value.trim(),
    description: description.value.trim(),
    ticket_price: Number(ticket_price.value),
    admin_password: admin_password.value,
    draw_date: draw_date.value || null,
    wheel: wheel.value || null,
    paypal_user: paypal_user.value || null,
    revolut_link: revolut_link.value || null,
    whatsapp_contact: whatsapp_contact.value || null,
  };
}

async function startCheckout() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = "login.html"; return; }

  const files = prize_images.files;
  if (files.length > 5) { alert("Max 5 immagini"); return; }

  const res = await fetch(`${SUPABASE_URL}/functions/v1/create-fee-checkout`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${session.access_token}`,
    },
    body: JSON.stringify({
      lottery_payload: buildPayload(),
      promo_code: promo_code.value.trim() || null
    })
  });

  const data = await res.json();
  if (!res.ok) {
    result.innerText = data.error || "Errore";
    return;
  }

  if (data.free) {
    location.href = "dashboard.html";
    return;
  }

  location.href = data.checkout_url;
}
</script>
</body>
</html>
