<!DOCTYPE html>
<html lang="it">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A8A">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lotteriffa">
<link rel="apple-touch-icon" href="/icon-192.png">

<meta charset="UTF-8" />
<title>Lotteria</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  font-family: Arial, sans-serif;
  padding: 16px;
  background: #FCD34D; /* 💛 GIALLO BRAND */
  margin: 0;
  overflow-x: hidden;
}

/* 🎱 Palline decorative trasparenti */
.ball {
  position: absolute;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
  color: rgba(30,58,138,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 36px;
  z-index: 0;
  pointer-events: none;
}

.ball1 { top: 60px; left: -60px; }
.ball2 { top: 180px; right: -60px; }

/* contenuti sopra le palline */
body > *:not(.ball) {
  position: relative;
  z-index: 1;
}

/* Titoli */
h1, h3 {
  text-align: center;
  margin: 6px 0;
  color: #1E3A8A;
}

#lottery-meta {
  text-align: center;
  color: #444;
  margin-bottom: 12px;
  white-space: pre-line;
}

/* Banner stato */
.status-banner {
  max-width: 600px;
  margin: 12px auto;
  padding: 14px;
  border-radius: 18px;
  text-align: center;
  font-weight: bold;
  background: rgba(255,255,255,0.7);
}

.status-active { color: #1E3A8A; }
.status-closed { color: #856404; }
.status-finished { color: #842029; }

/* Share */
.share-box {
  max-width: 600px;
  margin: 10px auto 18px;
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.btn {
  padding: 14px;
  border-radius: 18px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .15s ease;
}

.btn {
     transition: transform .12s ease, opacity .12s ease;
    }

    .btn:hover:not(:disabled) {
     transform: scale(1.02);
    }

    .btn:disabled {
     cursor: not-allowed;
    }

.whatsapp { background: #25D366; color: #fff; }
.stripe { background: #1E3A8A; color: #fff; }
.paypal { background: #003087; color: #fff; }
.revolut { background: #111; color: #fff; }
.cancel { background: #fff; color:#333; }

/* Galleria */
.gallery {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px 0;
  margin: 0 auto 16px;
  max-width: 600px;
}

.gallery img {
  height: 220px;
  border-radius: 18px;
  object-fit: cover;
  cursor: pointer;
}

/* Descrizione */
#lottery-description {
  background: rgba(255,255,255,0.7);
  padding: 16px;
  border-radius: 18px;
  margin: 12px auto;
  max-width: 600px;
  text-align: center;
}

/* Numeri */
.grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(10, 1fr);
}

@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(6, 1fr); }
}

.number {
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
      font-weight: bold;
      color: #fff;

      height: 64px;          /* altezza fissa */
      box-sizing: border-box;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      overflow: hidden;      /* non cresce con nomi lunghi */
    }

.number:active { transform: scale(0.95); }

.available { background: #1E3A8A; }
.sold { background: #c82333; opacity: .85; }
.pending { background: #ffc107; color: #333; }

.buyer {
  font-size: 11px;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.modal.show { display: flex; }

.modal-content {
  background: white;
  width: 100%;
  max-width: 360px;
  border-radius: 20px;
  padding: 20px;
}

.modal input {
  width: 100%;
  padding: 14px;
  margin-bottom: 14px;
  border-radius: 14px;
  border: 1px solid #ddd;
  text-align: center;
  font-size: 15px;
}

.field-label {
  font-size: 13px;
  font-weight: bold;
  color: #444;
  margin-bottom: 4px;
  display: block;
}

.divider {
  height: 1px;
  background: #eee;
  margin: 16px 0;
}
</style>
</head>

<body>

<div class="ball ball1">12</div>
<div class="ball ball2">37</div>

<h1 id="lottery-title"></h1>
<h3 id="lottery-price"></h3>
<p id="lottery-meta"></p>

<div class="share-box">
  <button class="btn whatsapp" onclick="shareWhatsapp()">
    Condividi LotteRiffa
  </button>

  <button class="btn stripe" onclick="goToCreateLottery()">
    ✨ Crea la tua Lotteriffa
  </button>
</div>

<div id="lottery-status-banner" style="display:none"></div>
<div id="prize-gallery" class="gallery"></div>

<div id="lottery-description">
  <strong>🎁 Premio in palio</strong><br><br>
  <span id="lottery-description-text"></span>
</div>

<div id="grid" class="grid"></div>

<div id="modal" class="modal">
  <div class="modal-content"></div>
</div>

<script>
const SUPABASE_URL = "https://fkgxomjctgvbpvgfgfko.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrZ3hvbWpjdGd2YnB2Z2ZnZmtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwNTA4NjYsImV4cCI6MjA4MDYyNjg2Nn0.Ogun4Qs4zGosOOify0yKC4NgO9vy3QPtvy6F96zo6Gk";
const LOTTERY_ID = new URLSearchParams(location.search).get("id");

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const modalContent = document.querySelector(".modal-content");

let currentRow = null;
let PAYMENT_METHODS = { stripe: true/false, paypal: false, revolut: false };
let LOTTERY_EXPIRED = false;
let LOTTERY_STATUS = "active"; // active/closed/finished

function buildPurchaseModalHTML() {
  return `
    <h3 id="modalTitle"></h3>

    <label class="field-label">Il tuo nome</label>
    <input id="nameField" placeholder="Es. Mario Rossi" />

    <div class="divider"></div>

    <div class="pay-title">Scegli il metodo di pagamento</div>

    <div class="pay-buttons">

      <button id="btnStripe" class="btn stripe" onclick="payWithStripe()">
        💳 Acquista con Stripe
      </button>

      <button id="btnPaypal" class="btn paypal" onclick="payManual('paypal')">
        <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" alt="PayPal">
        Acquista con PayPal
      </button>

      <button id="btnRevolut" class="btn revolut outlined" onclick="payManual('revolut')">
        <span class="revolut-icon">R</span>
        Acquista con Revolut
      </button>

    </div>

    <div class="divider"></div>

    <button class="btn cancel full" onclick="closeModal()">
      Annulla
    </button>
  `;
}

/* WHATSAPP */
function shareWhatsapp() {
  const text = encodeURIComponent(
    "🎟️ Partecipa a questa lotteria!\nProva a vincere un premio 🎁\n\n" + location.href
  );
  window.open(`https://wa.me/?text=${text}`, "_blank");
}

function goToCreateLottery() {
  location.href = "login.html";
}

/* LOAD LOTTERY */
async function loadLottery() {
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/lotteries?id=eq.${LOTTERY_ID}&select=title,ticket_price,description,draw_date,wheel,prize_images,status,paypal_user,revolut_link,stripe_enabled,whatsapp_contact`,
    { headers: { apikey: SUPABASE_ANON_KEY } }
  );

  const json = await r.json();
  const lot = Array.isArray(json) ? json[0] : null;
  if (!lot) return;

// 📲 CONTATTO OWNER (WhatsApp)
if (lot.whatsapp_contact && lot.whatsapp_contact.trim() !== "") {
  const btnWrap = document.getElementById("owner-contact");
  const btn = document.getElementById("contactOwnerBtn");

  const cleanNumber = lot.whatsapp_contact
    .replace(/\s+/g, "")
    .replace("+", "");

  btn.onclick = () => {
    window.open(
      `https://wa.me/${cleanNumber}?text=${encodeURIComponent(
        "Ciao! Avrei una domanda sulla tua lotteria 🙂"
      )}`,
      "_blank"
    );
  };

  btnWrap.style.display = "block";
}

// reset
PAYMENT_METHODS = { paypal: false, revolut: false };

// abilita SOLO se i dati owner esistono
if (lot.paypal_user && lot.paypal_user.trim() !== "") {
  PAYMENT_METHODS.paypal = true;
}

if (lot.revolut_link && lot.revolut_link.trim() !== "") {
  PAYMENT_METHODS.revolut = true;
}

  /* -------------------------
     STATO LOTTERIA
  ------------------------- */
  LOTTERY_STATUS = lot.status || "active";

  /* -------------------------
     DATI PRINCIPALI
  ------------------------- */
  document.getElementById("lottery-title").textContent = lot.title || "";
  document.getElementById("lottery-price").textContent =
    `Prezzo biglietto: € ${lot.ticket_price ?? ""}`;
  document.getElementById("lottery-description-text").textContent =
    lot.description || "";

  /* -------------------------
     DATA ESTRAZIONE + RUOTA
  ------------------------- */
  const meta = [];
  LOTTERY_EXPIRED = false;

  if (lot.draw_date) {
    const draw = new Date(lot.draw_date);
    draw.setHours(0, 0, 0, 0);

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    LOTTERY_EXPIRED = today > draw;

    const formatted =
      String(draw.getDate()).padStart(2, "0") + "/" +
      String(draw.getMonth() + 1).padStart(2, "0") + "/" +
      draw.getFullYear();

    meta.push(`📅 Estrazione: ${formatted}`);
  }

  if (lot.wheel) {
    meta.push(`🎡 Ruota: ${lot.wheel}`);
  }

  document.getElementById("lottery-meta").textContent = meta.join("\n");

  /* -------------------------
     BANNER STATO
  ------------------------- */
  const banner = document.getElementById("lottery-status-banner");
  banner.style.display = "block";

  const computedStatus = LOTTERY_EXPIRED ? "finished" : LOTTERY_STATUS;

  banner.className =
    "status-banner " +
    (computedStatus === "active"
      ? "status-active"
      : computedStatus === "closed"
      ? "status-closed"
      : "status-finished");

  banner.textContent =
    computedStatus === "active"
      ? "✅ Lotteria attiva"
      : computedStatus === "closed"
      ? "⛔ Vendite chiuse"
      : "🏁 Lotteria conclusa";

  /* -------------------------
     GALLERIA PREMI
  ------------------------- */
  renderGallery(lot.prize_images);
}

/* GALLERY */
function renderGallery(images) {
  const gallery = document.getElementById("prize-gallery");
  let arr = [];

  if (Array.isArray(images)) arr = images;
  else if (typeof images === "string") {
    try { arr = JSON.parse(images); } catch { arr = []; }
  }

  if (!arr.length) {
    gallery.style.display = "none";
    return;
  }

  gallery.style.display = "flex";
  gallery.innerHTML = "";

  arr.forEach(u => {
    if (!u) return;
    const i = document.createElement("img");
    i.src = u;
    i.onclick = () => window.open(u, "_blank");
    gallery.appendChild(i);
  });
}

/* LOAD NUMBERS */
async function loadNumbers() {
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/lottery_numbers?lottery_id=eq.${LOTTERY_ID}&order=number.asc`,
    { headers: { apikey: SUPABASE_ANON_KEY } }
  );
  const data = await r.json();

  grid.innerHTML = "";
  if (!Array.isArray(data)) return;

  data.forEach(row => {
    const d = document.createElement("div");
    const cls =
      row.status === "sold"
        ? "sold"
        : row.payment_status === "pending"
        ? "pending"
        : "available";

    d.className = `number ${cls}`;
    d.innerHTML = `
      <div>${row.number}</div>
      ${
        cls === "pending"
          ? `<div class="buyer">⏳ ${row.pending_buyer_name || ""}</div>`
          : cls === "sold"
          ? `<div class="buyer">${row.buyer_name || ""}</div>`
          : ""
      }
    `;

    const canBuy = (cls === "available") && !LOTTERY_EXPIRED && LOTTERY_STATUS === "active";

    if (canBuy) {
      d.onclick = () => openModal(row);
    } else {
      d.style.cursor = "not-allowed";
      d.style.opacity = "0.85";
    }

    grid.appendChild(d);
  });
}

function openModal(row) {
  currentRow = row;
  modalContent.innerHTML = buildPurchaseModalHTML();

if (!PAYMENT_METHODS.paypal) {
  modalContent.querySelector(".paypal").disabled = true;
  modalContent.querySelector(".paypal").style.opacity = "0.4";
}

if (!PAYMENT_METHODS.revolut) {
  modalContent.querySelector(".revolut").disabled = true;
  modalContent.querySelector(".revolut").style.opacity = "0.4";
}
  modalContent.querySelector("#modalTitle").textContent = `Acquista numero ${row.number}`;
// mostra solo i metodi abilitati
document.getElementById("btnStripe").style.display =
  PAYMENT_METHODS.stripe ? "flex" : "none";

document.getElementById("btnPaypal").style.display =
  PAYMENT_METHODS.paypal ? "flex" : "none";

document.getElementById("btnRevolut").style.display =
  PAYMENT_METHODS.revolut ? "flex" : "none";

  modalContent.querySelector("#nameField").value = "";
  modal.classList.add("show");
}

function closeModal() {
  modal.classList.remove("show");
  currentRow = null;
  // ripulisce sempre, così non resta “incastrato”
  modalContent.innerHTML = "";
}

/* STRIPE */
async function payWithStripe() {
  if (!currentRow) return;

  const name = modalContent.querySelector("#nameField")?.value.trim() || "";
  if (!name) return alert("Inserisci il nome");

  const r = await fetch(`${SUPABASE_URL}/functions/v1/create-checkout-session`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
    body: JSON.stringify({
      lottery_id: LOTTERY_ID,
      number_id: currentRow.id,
      buyer_name: name
    })
  });

  const d = await r.json();
  if (!d?.url) return alert("Errore Stripe");

  location.href = d.url;
}

/* PAYPAL / REVOLUT */
async function payManual(method) {
  if (!currentRow) return;

  const name = modalContent.querySelector("#nameField")?.value.trim() || "";
  if (!name) return alert("Inserisci il nome");

  const numberLabel = currentRow.number;

  const res = await fetch(`${SUPABASE_URL}/functions/v1/reserve-number-manual`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
    body: JSON.stringify({
      lottery_id: LOTTERY_ID,
      number_id: currentRow.id,
      buyer_name: name,
      payment_method: method
    })
  });

  const data = await res.json();
  console.log("RISPOSTA EDGE FUNCTION:", data);
  console.log("ISTRUZIONI:", data.instructions);

  if (!res.ok) return alert(data?.error || "Errore prenotazione");

  const amount = data?.instructions?.amount;
  const note = data?.instructions?.note || "";

  // Edge function attuale: instructions.paypal e instructions.revolut
  const paypalUser = data?.instructions?.paypal || null;
  const revolutUserOrLink = data?.instructions?.revolut || null;

  let paymentUrl = null;

if (method === "paypal" && data.instructions.paypal) {
  paymentUrl = `https://www.paypal.me/${data.instructions.paypal}/${amount}`;
}

if (method === "revolut" && data.instructions.revolut) {
  const username = String(data.instructions.revolut)
    .replace("https://revolut.me/", "")
    .replace("@", "")
    .trim();

  paymentUrl = `https://revolut.me/${username}`;
}

  if (!paymentUrl) return alert("Metodo di pagamento non disponibile (verifica dati owner)");

  // riepilogo nel modal + bottone Vai al pagamento
  modalContent.innerHTML = `
  <h3>💳 Completa l’acquisto</h3>

  <p>
    <b>Numero scelto:</b> ${numberLabel}<br>
    <b>Metodo:</b> ${method.toUpperCase()}<br>
    <b>Importo:</b> ${amount ?? "-"} <span style="color:#666;">(su Revolut lo inserisci manualmente)</span><br><br>
  </p>

  <div class="divider"></div>

  <p style="font-size:15px; color:#444;">
    💡 <b>Come funziona:</b><br>
    ⏳ Numero prenotato! Hai 30 minuti per pagare.<br>
    Dopo il pagamento, l’owner controllerà l’operazione.<br>
    Appena confermata, il numero sarà tuo 🎉.
  </p>

  <h3><button class="btn ${method}" id="goPayBtn" style="width:60%;">
    👉 Acquista
  </button><h3>

  <button class="btn cancel" onclick="closeModal()" style="width:60%;">Annulla</button>
`;

  document.getElementById("goPayBtn").onclick = () => {
    window.open(paymentUrl, "_blank");
// 🔒 disabilita pulsanti per evitare doppi click
modalContent.querySelectorAll("button").forEach(b => b.disabled = true);

// 🔁 schermata finale di conferma
modalContent.innerHTML = `
  <h3 style="text-align:center">✅ Pagamento inviato</h3>

  <p style="font-size:14px; line-height:1.4; text-align:center">
    Grazie per aver partecipato 🎉<br><br>
    Il pagamento è stato <b>inviato correttamente</b>.<br>
    L’organizzatore verificherà a breve.
  </p>

  <div class="divider"></div>

  <p style="font-size:13px;color:#555;text-align:center">
    ⏳ Il numero resterà <b>In attesa</b> fino alla conferma.<br>
    Se non viene confermato entro 30 minuti, tornerà disponibile.
  </p>

  <button class="btn cancel" onclick="closeModal()">Chiudi</button>
`;

    // importantissimo: chiudi/reset così non resta incastrato
    closeModal();
  };

  // aggiorna la griglia (numero diventa giallo)
  loadNumbers();
}

loadLottery();
loadNumbers();
</script>

</body>
</html>
