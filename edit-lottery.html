<!DOCTYPE html>
<html lang="it">
<head>
<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#1E3A8A">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lotteriffa">

<link rel="apple-touch-icon" href="/icon-192.png">
  <meta charset="UTF-8">
  <title>Modifica Lotteria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
body {
  font-family: Arial, sans-serif;
  background: #FCD34D;
  margin: 0;
  padding: 20px;
  overflow-x: hidden;
}

/* 🎱 Palline decorative */
.ball {
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: white;
  color: #1E3A8A;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 22px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  pointer-events: none;
  z-index: 0;
}

.ball1 { top: 40px; left: -30px; }
.ball2 { top: 10px; right: -40px; }

.container {
  max-width: 500px;
  margin: 60px auto;
  position: relative;
  z-index: 1;
}

/* 📱 Mobile centrato meglio */
@media (max-width: 520px) {
  body { padding: 16px; }
  .container { margin: 40px auto; max-width: 100%; }
  .ball1 { top: 18px; left: -45px; }
  .ball2 { top: -10px; right: -55px; }
}

h1, h2 {
  text-align: center;
  margin: 8px 0;
  color: #1E3A8A;
}

/* 🧊 Card stile glass */
.card {
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(4px);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Form */
label {
  font-weight: 600;
  margin-top: 12px;
  font-size: 14px;
  color: #0F1E4A;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 14px;
  border: 1px solid #ddd;
  font-size: 15px;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

textarea {
  resize: vertical;
  min-height: 90px;
}

/* 🔵 Bottoni brand */
.btn,
button {
  width: 100%;
  padding: 16px;
  border-radius: 18px;
  font-size: 15px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: transform 0.2s ease;
}

button:active,
.btn:active {
  transform: scale(0.98);
}

.primary {
  background: #1E3A8A;
  color: white;
}

.secondary {
  background: transparent;
  border: 2px solid #0F1E4A;
  color: #0F1E4A;
}

/* 📸 Immagini */
.images {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-top: 10px;
}

.img-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.img-wrap img {
  height: 90px;
  width: 120px;
  object-fit: cover;
  border-radius: 14px;
  background: #eee;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.img-wrap button {
  padding: 8px 12px;
  font-size: 13px;
  border-radius: 12px;
  background: #dc3545;
  color: #fff;
  border: none;
  cursor: pointer;
}

/* 🔙 Link back */
.back {
  display: inline-block;
  margin-bottom: 16px;
  text-decoration: none;
  color: #1E3A8A;
  font-weight: 600;
  font-size: 14px;
}

.readonly-field {
  background: rgba(255,255,255,0.6);
  color: #1E3A8A;
  font-weight: 600;
  border: 1px solid rgba(30,58,138,0.2);
}
</style>

</head>

<body>
<div class="container">

  <a class="back" href="#" id="backBtn">← Torna a Gestisci</a>

  <h1>✏️ Modifica Lotteria</h1>

  <!-- DATI -->
  <div class="card">
    <h2>Dati principali</h2>

    <label>Titolo</label>
    <input id="title">

    <label>Descrizione</label>
    <textarea id="description"></textarea>

    <label>Prezzo biglietto (€)</label>
    <input id="ticket_price" type="number" min="1" readonly class="readonly-field">
    <div style="font-size:12px;color:#666;margin-top:4px;">
    Il prezzo non può essere modificato dopo la creazione.
    </div>
    
    <label>Data estrazione</label>
    <input id="draw_date" type="date">

    <label>Ruota</label>
    <select id="wheel">
      <option value="">—</option>
      <option>Bari</option>
      <option>Cagliari</option>
      <option>Firenze</option>
      <option>Genova</option>
      <option>Milano</option>
      <option>Napoli</option>
      <option>Palermo</option>
      <option>Roma</option>
      <option>Torino</option>
      <option>Venezia</option>
      <option>Nazionale</option>
    </select>
  </div>

  <div class="card">
    <h2>💳 Dati pagamento</h2>

    <label>PayPal username</label>
    <input id="paypal_user">

    <label>Link Revolut</label>
    <input id="revolut_link">

    <div style="font-size:13px;color:#666;margin-top:10px;">
      Nota: il metodo appare solo se compilato.
    </div>

    <label style="margin-top:12px;">WhatsApp owner</label>
    <input id="whatsapp_contact">
  </div>

  <!-- IMMAGINI -->
  <div class="card">
    <h2>📷 Immagini premio</h2>

    <div id="imagesPreview" class="images"></div>

    <label>Aggiungi immagini (max 5 totali)</label>
    <input id="new_images" type="file" accept="image/*" multiple>
  </div>

  <!-- SALVA -->
  <div class="card">
    <button class="btn primary" onclick="saveChanges()">💾 Salva modifiche</button>
    <button class="btn secondary" onclick="goBack()">Annulla</button>
  </div>

</div>

<script>
const SUPABASE_URL = "https://fkgxomjctgvbpvgfgfko.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrZ3hvbWpjdGd2YnB2Z2ZnZmtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwNTA4NjYsImV4cCI6MjA4MDYyNjg2Nn0.Ogun4Qs4zGosOOify0yKC4NgO9vy3QPtvy6F96zo6Gk";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LOTTERY_ID = new URLSearchParams(location.search).get("id");

let EXISTING_IMAGES = []; // immagini già presenti nel DB
let NEW_IMAGES = [];      // immagini caricate ora

function normalizeImages(v) {
  if (Array.isArray(v)) return v;
  if (typeof v === "string") {
    try {
      const parsed = JSON.parse(v);
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }
  return [];
}

document.getElementById("backBtn").onclick = () => {
  location.href = `manage-lottery.html?id=${LOTTERY_ID}`;
};

function goBack() {
  location.href = `manage-lottery.html?id=${LOTTERY_ID}`;
}

async function requireAuth() {
  const { data, error } = await sb.auth.getUser();
  if (error || !data?.user) {
    location.href = "login.html";
    return null;
  }
  return data.user;
}

function renderImages() {
  const box = document.getElementById("imagesPreview");
  box.innerHTML = "";

  const allImages = [...EXISTING_IMAGES, ...NEW_IMAGES];

  if (!allImages.length) {
    box.innerHTML = `<div style="color:#666;font-size:14px;">Nessuna immagine</div>`;
    return;
  }

  allImages.forEach((url, idx) => {
    const wrap = document.createElement("div");
    wrap.className = "img-wrap";
    wrap.innerHTML = `
      <img src="${url}">
      <button>Rimuovi</button>
    `;

    wrap.querySelector("button").onclick = () => {
      if (idx < EXISTING_IMAGES.length) {
        EXISTING_IMAGES.splice(idx, 1);
      } else {
        NEW_IMAGES.splice(idx - EXISTING_IMAGES.length, 1);
      }
      renderImages();
    };

    box.appendChild(wrap);
  });
}

async function uploadNewImages() {
  const input = document.getElementById("new_images");
  const files = input.files;

  if (!files || files.length === 0) return;

  const totalAfter = EXISTING_IMAGES.length + NEW_IMAGES.length + files.length;
if (totalAfter > 5) {
  alert("Massimo 5 immagini totali");
  return;
}

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const ext = file.name.split(".").pop();
    const path = `lotteries/${LOTTERY_ID}/${Date.now()}_${i}.${ext}`;

    const { error } = await sb.storage
      .from("lottery-images")
      .upload(path, file, { upsert: false });

    if (error) {
      console.error(error);
      alert("Errore upload immagine");
      return;
    }

    const { data } = sb.storage
      .from("lottery-images")
      .getPublicUrl(path);

    NEW_IMAGES.push(data.publicUrl);
  }
  renderImages();
  input.value = "";
}

async function loadLottery(user) {
  const { data, error } = await sb
    .from("lotteries")
    .select("*")
    .eq("id", LOTTERY_ID)
    .maybeSingle();

  if (error) {
    console.error(error);
    alert("Errore caricamento lotteria");
    return;
  }

  if (!data) {
    alert("Lotteria non trovata");
    return;
  }

  if (data.owner_id !== user.id) {
    alert("Accesso non autorizzato");
    location.href = "dashboard.html";
    return;
  }

  document.getElementById("title").value = data.title || "";
  document.getElementById("description").value = data.description || "";
  document.getElementById("ticket_price").value = data.ticket_price ?? "";
  document.getElementById("draw_date").value = data.draw_date || "";
  document.getElementById("wheel").value = data.wheel || "";
  document.getElementById("whatsapp_contact").value = data.whatsapp_contact || "";
  document.getElementById("paypal_user").value = data.paypal_user || "";
  document.getElementById("revolut_link").value = data.revolut_link || "";

  EXISTING_IMAGES = normalizeImages(data.prize_images);
NEW_IMAGES = [];
renderImages();

}

async function saveChanges() {
  await uploadNewImages();

  const paypalUser = document.getElementById("paypal_user").value.trim();
  const revolutLink = document.getElementById("revolut_link").value.trim();

  const payload = {
    title: document.getElementById("title").value.trim(),
    description: document.getElementById("description").value.trim(),
    draw_date: document.getElementById("draw_date").value || null,
    wheel: document.getElementById("wheel").value || null,
    whatsapp_contact: document.getElementById("whatsapp_contact").value.trim() || null,
    paypal_user: paypalUser || null,
    revolut_link: revolutLink || null,
  };

const finalImages = [...EXISTING_IMAGES, ...NEW_IMAGES];
payload.prize_images = finalImages;

  const { error } = await sb
    .from("lotteries")
    .update(payload)
    .eq("id", LOTTERY_ID);

  if (error) {
    console.error(error);
    alert("Errore salvataggio");
    return;
  }

  alert("Modifiche salvate");
  goBack();
}

/* ✅ AVVIO PAGINA */
(async () => {
  if (!LOTTERY_ID) {
    alert("ID lotteria mancante nell'URL");
    location.href = "dashboard.html";
    return;
  }

  const user = await requireAuth();
  if (!user) return;

  await loadLottery(user);
})();
</script>

</body>
</html>
